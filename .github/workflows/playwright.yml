name: OmniPlay E2E — Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Playwright E2E & API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://dev3.openmrs.org/openmrs/spa' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://dev3.openmrs.org/openmrs/ws/rest/v1' }}
      APP_USERNAME: ${{ secrets.APP_USERNAME || 'admin' }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD || 'Admin123' }}
      APP_LOCATION: ${{ secrets.APP_LOCATION || 'Outpatient Clinic' }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
